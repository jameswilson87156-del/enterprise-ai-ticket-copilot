spring:
  application:
    name: enterprise-ai-ticket-copilot
  ai:
    openai:
      # 默认使用 DashScope；也可通过通用变量切换到任意 OpenAI Chat Completions 兼容端点。
      # 未配置 Key 时使用占位符保证应用可启动，AI 分类自动降级为规则引擎。
      base-url: ${AI_CHAT_BASE_URL:${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${AI_CHAT_API_KEY:${AI_DASHSCOPE_API_KEY:placeholder-not-configured}}
      chat:
        options:
          model: ${AI_CHAT_MODEL:${AI_DASHSCOPE_CHAT_MODEL:qwen-plus}}
          temperature: 0.2
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:${AI_DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}}
    mcp:
      server:
        name: ticket-copilot-mcp
        version: 0.0.1
        # SSE 传输：客户端连接 /sse，消息回传 POST /mcp/message
        protocol: SSE
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

logging:
  level:
    com.enterpriseai.ticketcopilot: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ticket-copilot:
  ai:
    # DeepSeek Chat-only profile 可关闭向量索引，检索退化为关键词路径。
    embedding-enabled: ${AI_EMBEDDING_ENABLED:true}
