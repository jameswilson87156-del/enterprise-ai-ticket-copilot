spring:
  config:
    activate:
      on-profile: staging
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Staging must receive an explicit private RDS URL from the deployment
    # environment. Leaving this blank makes a missing wiring error fail fast
    # instead of silently connecting to a local/default database.
    url: ${TICKET_DB_URL:}
    username: ${TICKET_DB_USERNAME:}
    password: ${TICKET_DB_PASSWORD:}
  sql:
    init:
      mode: never

ticket:
  ai:
    fallback-to-local: false
    rate-limit:
      enabled: true
  auth:
    mode: OIDC
    issuer-uri: ${TICKET_AUTH_ISSUER_URI:}
    audience: ${TICKET_AUTH_AUDIENCE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
